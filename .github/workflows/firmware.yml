name: Firmware builds

# Generate a starter project for every board profile and compile it,
# so a broken profile or template fails CI.
on:
  push:
    branches: [main]
    paths: ["skills/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["skills/**", "tools/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      display_matrix: ${{ steps.m.outputs.display_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python tools/ci_matrix.py >> "$GITHUB_OUTPUT"

  esp-idf:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: python skills/waveshare-esp32/scripts/wsesp.py new ${{ matrix.board }} --framework idf --name ci_app --out ci/${{ matrix.board }}
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: ${{ matrix.target }}
          path: ci/${{ matrix.board }}

  esp-idf-display:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.display_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate project with display + LVGL
        run: python skills/waveshare-esp32/scripts/wsesp.py new ${{ matrix.board }} --framework idf --with display --name ci_ui --out ci/${{ matrix.board }}
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: ${{ matrix.target }}
          path: ci/${{ matrix.board }}

  arduino:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install esp32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Generate and compile sketch
        run: |
          python skills/waveshare-esp32/scripts/wsesp.py new ${{ matrix.board }} --framework arduino --name ci_app --out ci/${{ matrix.board }}
          arduino-cli compile ci/${{ matrix.board }}/ci_app
